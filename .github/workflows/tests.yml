name: Testy

# Běží při každém pushi a pull requestu. Vercel nasazuje nezávisle na tom: červený křížek znamená
# „pozor, něco se rozbilo“, web se ale nasadí i tak (blokovat nasazení jde jen v placených plánech Vercelu).
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  testy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: pip install -r requirements.txt
      - name: Všechny testy (offline)
        run: python3 tests/run_all.py
